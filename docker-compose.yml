services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/vendor
    env_file:
      - ./backend/.env
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: db_huutoan
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: huutoan
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"   # map ra ngoài port khác để tránh đụng MySQL local nếu có
    volumes:
      - mysql_data:/var/lib/mysql

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  mysql_data: